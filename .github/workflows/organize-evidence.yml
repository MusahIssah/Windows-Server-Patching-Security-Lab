name: Repair publication layout

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publication-layout
  cancel-in-progress: false

jobs:
  organize:
    if: github.repository == 'MusahIssah/Windows-Server-Patching-Security-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore overview, organize evidence, and validate links
        shell: python
        run: |
          import base64
          import hashlib
          import pathlib
          import re
          import subprocess
          import urllib.parse

          root = pathlib.Path.cwd()
          evidence = root / '06-Evidence'
          screenshots = sorted(root.glob('*.png'))
          before = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in screenshots}
          if screenshots:
              readme = root / 'README.md'
              if not readme.read_text(encoding='utf-8').startswith('# Published evidence'):
                  raise SystemExit('Unexpected root README; review before moving files.')
              evidence.mkdir(exist_ok=True)
              destinations = [evidence / p.name for p in screenshots] + [evidence / 'README.md']
              if any(p.exists() for p in destinations):
                  raise SystemExit('An evidence destination already exists; nothing was moved.')
              readme.rename(evidence / 'README.md')
              for source in screenshots:
                  source.rename(evidence / source.name)
              readme.write_bytes(base64.b64decode(''))
              (root / '.gitignore').write_bytes(base64.b64decode(''))
              (root / '.gitattributes').write_bytes(base64.b64decode('KiB0ZXh0PWF1dG8KKi5tZCB0ZXh0IGVvbD1sZgoqLnBuZyBiaW5hcnkK'))
              for name, digest in before.items():
                  assert hashlib.sha256((evidence / name).read_bytes()).hexdigest() == digest, name
              changelog = root / 'CHANGELOG.md'
              text = changelog.read_text(encoding='utf-8')
              text = text.replace('Publication editing reconciles LAB-CHG-005\u2019s final count table with its zero-needed follow-up.', 'Publication editing labels LAB-CHG-005\u2019s 21/70 table as an intermediate result and retains its later zero-needed follow-up.')
              text = text.replace("Publication editing reconciles LAB-CHG-005's final count table with its zero-needed follow-up.", "Publication editing labels LAB-CHG-005's 21/70 table as an intermediate result and retains its later zero-needed follow-up.")
              text += '\n## Publication layout repair\n\n- Restore the project overview at the repository root.\n- Move all 136 uploaded screenshots and their index into `06-Evidence`.\n- Preserve screenshot contents and filenames; verify local documentation links.\n'
              changelog.write_text(text, encoding='utf-8')
          failures = []
          for document in root.rglob('*.md'):
              if '.git' in document.parts:
                  continue
              for link in re.findall(r'\]\(([^)]+)\)', document.read_text(encoding='utf-8')):
                  link = link.strip().strip('<>')
                  if urllib.parse.urlsplit(link).scheme or link.startswith('#'):
                      continue
                  target = urllib.parse.unquote(link.split('#', 1)[0])
                  if not (document.parent / target).exists():
                      failures.append(f'{document.relative_to(root)}: {link}')
          if failures:
              raise SystemExit('\n'.join(failures))
          assert len(list(evidence.glob('*.png'))) == 136, 'Expected 136 evidence screenshots'
          print(f'Checked documentation links; preserved {len(before)} moved screenshots.')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '--all'], check=True)
          if subprocess.run(['git', 'diff', '--cached', '--quiet']).returncode:
              subprocess.run(['git', 'commit', '-m', 'Restore project overview and organize evidence screenshots'], check=True)
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
          else:
              print('Publication layout is already organized; no commit needed.')
